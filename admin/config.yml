backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handle auth once this site is deployed on Netlify —
# see HANDOFF.md. This admin panel won't be able to log in on GitHub Pages or from
# a local file:// preview; that's expected, not a bug.

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "General Settings"
        name: "general"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title — Line 1", name: "titleLine1", widget: "string" }
              - { label: "Title — Line 2", name: "titleLine2", widget: "string" }
              - { label: "Subheading", name: "subhead", widget: "text" }
              - { label: "Background Image", name: "image", widget: "image" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Office", name: "office", widget: "string" }

  - name: "sponsorship"
    label: "Sponsorship"
    files:
      - file: "content/sponsorship.json"
        label: "Sponsorship Pitch & Packages"
        name: "sponsorship"
        fields:
          - label: "Pitch"
            name: "pitch"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Audience Stats"
            name: "stats"
            widget: "list"
            summary: "{{value}} — {{label}}"
            hint: "Keep these round/illustrative until real audience numbers are available."
            fields:
              - { label: "Value", name: "value", widget: "string", hint: "e.g. 5,000+" }
              - { label: "Label", name: "label", widget: "string", hint: "e.g. Fans Per Event" }
          - label: "Sponsorship Opportunities"
            name: "offerings"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Ring Banner, Fighter Walkout" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Sponsorship Tiers"
            name: "tiers"
            widget: "list"
            summary: "{{name}} — {{price}}"
            fields:
              - { label: "Tier Name", name: "name", widget: "string", hint: "e.g. Bronze, Silver, Gold, Title Sponsor" }
              - { label: "Price", name: "price", widget: "string", hint: "e.g. $2,500" }
              - { label: "Period", name: "period", widget: "string", hint: "e.g. per event", required: false }
              - { label: "Highlight this tier", name: "featured", widget: "boolean", default: false, hint: "Shows a \"Most Popular\" badge and highlighted border" }
              - { label: "Perks", name: "perks", widget: "list", field: { label: "Perk", name: "perk", widget: "string" } }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{name}} — {{company}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Marketing Director" }
              - { label: "Company", name: "company", widget: "string" }

  - name: "fights"
    label: "Fights"
    files:
      - file: "content/fights.json"
        label: "Fight Schedule & Results"
        name: "fights"
        fields:
          - label: "Fights"
            name: "fights"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Upcoming", value: "upcoming" }
                  - { label: "Completed", value: "completed" }
                hint: "Upcoming fights show on the Schedule with a countdown on the soonest one. Completed fights show in Past Results."
              - { label: "Fight / Event Name", name: "title", widget: "string" }
              - { label: "Date & Time", name: "date", widget: "datetime", hint: "Drives sorting and the countdown timer." }
              - { label: "Date Label", name: "dateLabel", widget: "string", hint: "How the date displays on the card, e.g. Oct 3, 2026" }
              - { label: "Badge (upcoming only)", name: "badge", widget: "string", required: false, hint: "e.g. Main Event, Title Fight, Upcoming" }
              - { label: "Venue (upcoming only)", name: "venue", widget: "string", required: false }
              - { label: "Weight Class / Rounds (upcoming only)", name: "weightClass", widget: "string", required: false }
              - { label: "Ticket Link (upcoming only)", name: "ticketLink", widget: "string", required: false, default: "#contact" }
              - label: "Fighter A (upcoming only)"
                name: "fighterA"
                widget: "object"
                required: false
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Record", name: "record", widget: "string", hint: "e.g. 24-0-0 · 20 KO" }
                  - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Leave blank to show a placeholder silhouette" }
              - label: "Fighter B (upcoming only)"
                name: "fighterB"
                widget: "object"
                required: false
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Record", name: "record", widget: "string" }
                  - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Leave blank to show a placeholder silhouette" }
              - { label: "Result (completed only)", name: "result", widget: "string", required: false, hint: "Short one-liner, e.g. Bradley def. Kane · TKO Round 7" }
              - { label: "Recap (completed only)", name: "recap", widget: "text", required: false, hint: "Longer paragraph shown when a visitor clicks the result card" }

  - name: "fighters"
    label: "Fighters"
    files:
      - file: "content/fighters.json"
        label: "Fighter Roster"
        name: "fighters"
        fields:
          - label: "Fighters"
            name: "fighters"
            widget: "list"
            summary: "{{name}} — {{division}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Division"
                name: "division"
                widget: "select"
                options: ["Heavyweight", "Cruiserweight", "Light Heavyweight", "Middleweight", "Welterweight", "Lightweight", "Featherweight", "Bantamweight"]
              - { label: "Wins", name: "wins", widget: "number", value_type: "int", min: 0 }
              - { label: "Losses", name: "losses", widget: "number", value_type: "int", min: 0 }
              - { label: "Draws", name: "draws", widget: "number", value_type: "int", min: 0 }
              - { label: "KOs", name: "kos", widget: "number", value_type: "int", min: 0 }
              - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Leave blank to show a placeholder silhouette" }
              - { label: "Bio", name: "bio", widget: "text" }

  - name: "news"
    label: "News"
    files:
      - file: "content/news.json"
        label: "News Posts"
        name: "news"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Date Label", name: "dateLabel", widget: "string", hint: "How the date displays, e.g. Sep 25, 2026" }
              - { label: "Tag", name: "tag", widget: "string", hint: "e.g. Championship, Interview, Announcement" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Link", name: "link", widget: "string", required: false, default: "#" }
