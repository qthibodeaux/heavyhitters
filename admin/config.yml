backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handle auth once this site is deployed on Netlify —
# see HANDOFF.md. This admin panel won't be able to log in on GitHub Pages or from
# a local file:// preview; that's expected, not a bug.

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "mission"
    label: "Fighting For A Cause"
    files:
      - file: "content/mission.json"
        label: "Charity Mission & Beneficiary"
        name: "mission"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Body", name: "body", widget: "text" }
          - label: "Current Event Beneficiary"
            name: "beneficiary"
            widget: "object"
            fields:
              - { label: "Event Label", name: "eventLabel", widget: "string", hint: "e.g. January 30, 2027 Beneficiary" }
              - { label: "Organization Name", name: "orgName", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Spokesperson / Leadership Line", name: "spokesperson", widget: "string", required: false }
              - label: "Media"
                name: "media"
                widget: "object"
                hint: "Fill in ONE of Image / YouTube Link / Uploaded Video. Leave all blank and this media area disappears cleanly — the section reflows, nothing looks missing."
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "YouTube Link", name: "youtubeUrl", widget: "string", required: false, hint: "Paste a full YouTube URL" }
                  - { label: "Uploaded Video", name: "videoFile", widget: "file", required: false }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
                  - { label: "Start Time", name: "startTime", widget: "string", required: false, hint: "Optional — play only part of the video. Use M:SS (e.g. 4:56). Leave blank to start from the beginning." }
                  - { label: "End Time", name: "endTime", widget: "string", required: false, hint: "Optional — e.g. 5:34. Leave blank to play to the end." }

  - name: "about"
    label: "About / Self-Introduction"
    files:
      - file: "content/about.json"
        label: "About Heavy Hitters"
        name: "about"
        fields:
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Body", name: "body", widget: "text" }
          - label: "Media"
            name: "media"
            widget: "object"
            hint: "Fill in ONE of Image / YouTube Link / Uploaded Video. Leave all blank and this media area disappears cleanly — the section reflows to centered text, nothing looks missing."
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "YouTube Link", name: "youtubeUrl", widget: "string", required: false }
              - { label: "Uploaded Video", name: "videoFile", widget: "file", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Start Time", name: "startTime", widget: "string", required: false, hint: "Optional — play only part of the video. Use M:SS (e.g. 4:56)." }
              - { label: "End Time", name: "endTime", widget: "string", required: false, hint: "Optional — e.g. 5:34. Leave blank to play to the end." }

  - name: "interviews"
    label: "Interviews"
    files:
      - file: "content/interviews.json"
        label: "Interview Spotlights"
        name: "interviews"
        fields:
          - label: "Interview Clips"
            name: "interviews"
            widget: "list"
            summary: "{{label}} — {{speaker}}"
            hint: "Add as many clips as you have — the layout sizes itself to the count, and the whole section hides if the list is empty. To pull several clips from one long interview, add an entry per clip using the same video link with different Start/End times."
            fields:
              - { label: "Label", name: "label", widget: "string", hint: "The topic, e.g. Organization, Community & Charity" }
              - { label: "Speaker", name: "speaker", widget: "string", required: false, hint: "Who's talking — shown as attribution under the text" }
              - { label: "Pull Quote / Description", name: "quote", widget: "text" }
              - label: "Media"
                name: "media"
                widget: "object"
                hint: "Fill in ONE of Image / YouTube Link / Uploaded Video. Leave all blank and the card shows text only."
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "YouTube Link", name: "youtubeUrl", widget: "string", required: false }
                  - { label: "Uploaded Video", name: "videoFile", widget: "file", required: false }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
                  - { label: "Start Time", name: "startTime", widget: "string", required: false, hint: "Optional — play only part of the video. Use M:SS (e.g. 9:55)." }
                  - { label: "End Time", name: "endTime", widget: "string", required: false, hint: "Optional — e.g. 10:35. Leave blank to play to the end." }

  - name: "partners"
    label: "Partner Logos"
    files:
      - file: "content/partners.json"
        label: "Partner / Sponsor Logos"
        name: "partners"
        fields:
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{name}}"
            hint: "The Partners section stays hidden until there are at least 3 logos — a half-empty logo wall undersells you. Add the third and it appears on the live site automatically."
            fields:
              - { label: "Company Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Leave blank to show a placeholder tile" }
              - { label: "Link", name: "link", widget: "string", required: false }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/settings.json"
        label: "General Settings"
        name: "general"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title — Line 1", name: "titleLine1", widget: "string" }
              - { label: "Title — Line 2", name: "titleLine2", widget: "string" }
              - { label: "Subheading", name: "subhead", widget: "text" }
              - { label: "Background Image (fallback / poster)", name: "image", widget: "image", hint: "Always shown as the poster frame, and used if no video is set." }
              - { label: "Background Video (uploaded file)", name: "videoFile", widget: "file", required: false, hint: "Takes priority over the YouTube link and the image. Keep it short and muted-friendly — it autoplays on loop with no sound." }
              - { label: "Background Video (YouTube link)", name: "youtubeUrl", widget: "string", required: false, hint: "Used only if no uploaded video file is set above." }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Sponsorships & Sales Email", name: "salesEmail", widget: "string" }
              - { label: "Event & Partnership Inquiries Email", name: "partnershipsEmail", widget: "string" }
              - { label: "Office", name: "office", widget: "string" }
          - label: "Section Visibility"
            name: "sections"
            widget: "object"
            hint: "Uncheck a section to hide it from the live site. Nothing is deleted — its content stays saved and comes right back the moment you re-check it."
            fields:
              - { label: "Fighting For A Cause / Mission", name: "mission", widget: "boolean", default: true }
              - { label: "About / Self-Introduction", name: "about", widget: "boolean", default: true }
              - { label: "Sponsorship Pitch, Audience & Content Offerings", name: "sponsorship", widget: "boolean", default: true }
              - { label: "Interviews", name: "interviews", widget: "boolean", default: true }
              - { label: "Social Proof / Testimonials", name: "social-proof", widget: "boolean", default: true }
              - { label: "Partner Logos", name: "partners", widget: "boolean", default: true }
              - { label: "Sponsorship Packages", name: "packages", widget: "boolean", default: true }
              - { label: "Upcoming Fights / Schedule", name: "schedule", widget: "boolean", default: true }
              - { label: "Past Results", name: "results", widget: "boolean", default: true }
              - { label: "Fighter Roster / The Team", name: "roster", widget: "boolean", default: true }
              - { label: "News", name: "news", widget: "boolean", default: true }

  - name: "sponsorship"
    label: "Sponsorship"
    files:
      - file: "content/sponsorship.json"
        label: "Sponsorship Pitch & Packages"
        name: "sponsorship"
        fields:
          - label: "Pitch"
            name: "pitch"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - label: "Audience Stats"
            name: "stats"
            widget: "list"
            summary: "{{value}} — {{label}}"
            hint: "Keep these round/illustrative until real audience numbers are available."
            fields:
              - { label: "Value", name: "value", widget: "string", hint: "e.g. 5,000+" }
              - { label: "Label", name: "label", widget: "string", hint: "e.g. Fans Per Event" }
          - label: "Sponsorship Opportunities"
            name: "offerings"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Ring Banner, Fighter Walkout" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Sponsorship Packages"
            name: "packages"
            widget: "list"
            summary: "{{category}} — {{name}}"
            hint: "No pricing is shown on the site — availability counts create urgency instead. Add as many packages as needed; group them by Category."
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Ring & Event Branding", "Core Sponsorship", "VIP & Corporate Hospitality"]
              - { label: "Package Name", name: "name", widget: "string", hint: "e.g. Center Canvas Logo" }
              - { label: "Availability", name: "availability", widget: "string", hint: "e.g. \"1 available\" or \"4 available\" — no dollar amounts" }
              - { label: "Highlight this package", name: "featured", widget: "boolean", default: false, hint: "Shows a featured badge and highlighted border" }
              - { label: "Benefits", name: "benefits", widget: "list", field: { label: "Benefit", name: "benefit", widget: "string" } }
          - label: "Custom Partnerships"
            name: "customPartnerships"
            widget: "object"
            hint: "The open-ended, no-pricing-published category — apparel, media, hospitality, etc."
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Areas", name: "areas", widget: "list", field: { label: "Area", name: "area", widget: "string" } }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{name}} — {{company}}"
            hint: "The What Sponsors Say section stays hidden until there are at least 4 quotes, so it never looks thin. Only use real, attributable quotes from actual sponsors."
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Marketing Director" }
              - { label: "Company", name: "company", widget: "string" }
          - label: "Closing Call-To-Action"
            name: "cta"
            widget: "object"
            hint: "An optional video shown directly above the Become a Sponsor button. Leave the media blank and only the button shows."
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: false }
              - label: "Media"
                name: "media"
                widget: "object"
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "YouTube Link", name: "youtubeUrl", widget: "string", required: false }
                  - { label: "Uploaded Video", name: "videoFile", widget: "file", required: false }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
                  - { label: "Start Time", name: "startTime", widget: "string", required: false, hint: "Optional — use M:SS (e.g. 45:50)." }
                  - { label: "End Time", name: "endTime", widget: "string", required: false, hint: "Optional — e.g. 47:17." }

  - name: "fights"
    label: "Fights"
    files:
      - file: "content/fights.json"
        label: "Fight Schedule & Results"
        name: "fights"
        fields:
          - label: "Fights"
            name: "fights"
            widget: "list"
            summary: "{{title}} — {{status}}"
            fields:
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Upcoming", value: "upcoming" }
                  - { label: "Completed", value: "completed" }
                hint: "Upcoming fights show on the Schedule with a countdown on the soonest one. Completed fights show in Past Results."
              - { label: "Fight / Event Name", name: "title", widget: "string" }
              - { label: "Date & Time", name: "date", widget: "datetime", hint: "Drives sorting and the countdown timer." }
              - { label: "Date Label", name: "dateLabel", widget: "string", hint: "How the date displays on the card, e.g. Oct 3, 2026" }
              - { label: "Badge (upcoming only)", name: "badge", widget: "string", required: false, hint: "e.g. Main Event, Title Fight, Upcoming" }
              - { label: "Venue (upcoming only)", name: "venue", widget: "string", required: false }
              - { label: "Weight Class / Rounds (upcoming only)", name: "weightClass", widget: "string", required: false }
              - { label: "Ticket Link (upcoming only)", name: "ticketLink", widget: "string", required: false, default: "#contact" }
              - label: "Fighter A (upcoming only)"
                name: "fighterA"
                widget: "object"
                required: false
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Record", name: "record", widget: "string", hint: "e.g. 24-0-0 · 20 KO" }
                  - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Leave blank to show a placeholder silhouette" }
              - label: "Fighter B (upcoming only)"
                name: "fighterB"
                widget: "object"
                required: false
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Record", name: "record", widget: "string" }
                  - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Leave blank to show a placeholder silhouette" }
              - { label: "Result (completed only)", name: "result", widget: "string", required: false, hint: "Short one-liner, e.g. Bradley def. Kane · TKO Round 7" }
              - { label: "Recap (completed only)", name: "recap", widget: "text", required: false, hint: "Longer paragraph shown when a visitor clicks the result card" }
              - label: "Recap Media (completed only)"
                name: "media"
                widget: "object"
                required: false
                hint: "Fill in ONE of Image / YouTube Link / Uploaded Video, shown in the result popup. Leave all blank and the popup shows text only."
                fields:
                  - { label: "Image", name: "image", widget: "image", required: false }
                  - { label: "YouTube Link", name: "youtubeUrl", widget: "string", required: false }
                  - { label: "Uploaded Video", name: "videoFile", widget: "file", required: false }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
                  - { label: "Start Time", name: "startTime", widget: "string", required: false, hint: "Optional — use M:SS." }
                  - { label: "End Time", name: "endTime", widget: "string", required: false, hint: "Optional — use M:SS." }

  - name: "fighters"
    label: "Fighters"
    files:
      - file: "content/fighters.json"
        label: "Fighter Roster"
        name: "fighters"
        fields:
          - label: "Fighters"
            name: "fighters"
            widget: "list"
            summary: "{{name}} — {{division}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - label: "Division"
                name: "division"
                widget: "select"
                options: ["Heavyweight", "Cruiserweight", "Light Heavyweight", "Middleweight", "Welterweight", "Lightweight", "Featherweight", "Bantamweight"]
              - { label: "Wins", name: "wins", widget: "number", value_type: "int", min: 0 }
              - { label: "Losses", name: "losses", widget: "number", value_type: "int", min: 0 }
              - { label: "Draws", name: "draws", widget: "number", value_type: "int", min: 0 }
              - { label: "KOs", name: "kos", widget: "number", value_type: "int", min: 0 }
              - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Leave blank to show a placeholder silhouette" }
              - { label: "Bio", name: "bio", widget: "text" }

  - name: "news"
    label: "News"
    files:
      - file: "content/news.json"
        label: "News Posts"
        name: "news"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Date", name: "date", widget: "datetime" }
              - { label: "Date Label", name: "dateLabel", widget: "string", hint: "How the date displays, e.g. Sep 25, 2026" }
              - { label: "Tag", name: "tag", widget: "string", hint: "e.g. Championship, Interview, Announcement" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Link", name: "link", widget: "string", required: false, default: "#" }
